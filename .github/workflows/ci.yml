name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI-only values; nothing here is a real secret.
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  BETTER_AUTH_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-only-secret-value-that-is-at-least-32-chars
  ALLOWED_OWNER_EMAILS: owner@example.com
  ATLAS_DATA_KEY_CURRENT: v1
  DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint · typecheck · test · migrate · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Secret scan (tracked files)
        run: |
          if git grep -nE "(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)" -- ':!pnpm-lock.yaml'; then
            echo "Potential secret committed"; exit 1; fi

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

      - name: Migrations apply cleanly and match the schema
        run: |
          pnpm db:migrate
          pnpm db:check

      - name: Unit, DOM, and database tests
        run: pnpm test
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      - run: pnpm build

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end (five viewports)
        run: pnpm test:e2e
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
